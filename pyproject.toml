[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vendas-cli"
dynamic = ["version"]
description = "Relatório de vendas a partir de CSV: totais, curva ABC, XYZ e vendas por mês."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
vendas-cli = "vendas_cli.cli:main"

[tool.setuptools.dynamic]
version = { attr = "vendas_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vendas_cli = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vendas_cli --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["vendas_cli"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
